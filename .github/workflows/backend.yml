name: Backend checks

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  api-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          # CI-only throwaway database: trust auth, no password, never reachable outside the runner.
          POSTGRES_USER: gymbud
          POSTGRES_DB: gymbud_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymbud -d gymbud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gymbud@localhost:5432/gymbud_test
      TEST_DATABASE_URL: postgresql+psycopg://gymbud@localhost:5432/gymbud_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
