<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12121e;stop-opacity:1" />
    </linearGradient>

    <!-- Neon red/orange gradient for barbell -->
    <linearGradient id="barbellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4d00" />
      <stop offset="50%" style="stop-color:#ff2244" />
      <stop offset="100%" style="stop-color:#ff4d00" />
    </linearGradient>

    <!-- Weight plate gradient -->
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2a2a3a" />
      <stop offset="100%" style="stop-color:#111118" />
    </radialGradient>

    <!-- AI circuit glow gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff" />
      <stop offset="100%" style="stop-color:#7b2fff" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="#1e1e2e" stroke-width="2"/>

  <!-- Subtle hexagonal grid texture -->
  <g opacity="0.06" stroke="#00e5ff" stroke-width="0.5" fill="none">
    <path d="M200 30 L220 45 L220 75 L200 90 L180 75 L180 45 Z"/>
    <path d="M240 55 L260 70 L260 100 L240 115 L220 100 L220 70 Z"/>
    <path d="M160 55 L180 70 L180 100 L160 115 L140 100 L140 70 Z"/>
    <path d="M280 105 L300 120 L300 150 L280 165 L260 150 L260 120 Z"/>
    <path d="M120 105 L140 120 L140 150 L120 165 L100 150 L100 120 Z"/>
    <path d="M310 165 L330 180 L330 210 L310 225 L290 210 L290 180 Z"/>
    <path d="M90 165 L110 180 L110 210 L90 225 L70 210 L70 180 Z"/>
    <path d="M280 245 L300 260 L300 290 L280 305 L260 290 L260 260 Z"/>
    <path d="M120 245 L140 260 L140 290 L120 305 L100 290 L100 260 Z"/>
    <path d="M240 295 L260 310 L260 340 L240 355 L220 340 L220 310 Z"/>
    <path d="M160 295 L180 310 L180 340 L160 355 L140 340 L140 310 Z"/>
    <path d="M200 320 L220 335 L220 365 L200 380 L180 365 L180 335 Z"/>
  </g>

  <!-- ===== BARBELL ===== -->
  <!-- Bar shaft -->
  <rect x="60" y="193" width="280" height="14" rx="7" fill="url(#barbellGrad)" filter="url(#redGlow)"/>

  <!-- Left outer plate -->
  <rect x="62" y="158" width="28" height="84" rx="6" fill="url(#plateGrad)" stroke="#ff2244" stroke-width="1.5" filter="url(#softGlow)"/>
  <!-- Left inner plate -->
  <rect x="96" y="165" width="22" height="70" rx="5" fill="url(#plateGrad)" stroke="#ff4d00" stroke-width="1.2" filter="url(#softGlow)"/>

  <!-- Right outer plate -->
  <rect x="310" y="158" width="28" height="84" rx="6" fill="url(#plateGrad)" stroke="#ff2244" stroke-width="1.5" filter="url(#softGlow)"/>
  <!-- Right inner plate -->
  <rect x="282" y="165" width="22" height="70" rx="5" fill="url(#plateGrad)" stroke="#ff4d00" stroke-width="1.2" filter="url(#softGlow)"/>

  <!-- Plate shine lines -->
  <line x1="67" y1="168" x2="67" y2="232" stroke="#ff6644" stroke-width="1" opacity="0.5"/>
  <line x1="315" y1="168" x2="315" y2="232" stroke="#ff6644" stroke-width="1" opacity="0.5"/>

  <!-- ===== AI CIRCUIT BRAIN in center ===== -->
  <!-- Center glow pulse circle -->
  <circle cx="200" cy="200" r="38" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.3"/>
  <circle cx="200" cy="200" r="30" fill="#0d0d1a" stroke="url(#circuitGrad)" stroke-width="1.5"/>

  <!-- Brain/circuit icon inside circle -->
  <!-- Left hemisphere -->
  <path d="M200 185 C193 185 186 188 183 193 C180 198 180 205 183 210 C186 215 193 218 200 218"
        fill="none" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <!-- Right hemisphere -->
  <path d="M200 185 C207 185 214 188 217 193 C220 198 220 205 217 210 C214 215 207 218 200 218"
        fill="none" stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round" filter="url(#cyanGlow)"/>
  <!-- Center divide -->
  <line x1="200" y1="185" x2="200" y2="218" stroke="url(#circuitGrad)" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#cyanGlow)"/>
  <!-- Brain folds left -->
  <path d="M186 193 C189 191 192 196 189 199" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M184 204 C187 202 190 207 187 210" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Brain folds right -->
  <path d="M214 193 C211 191 208 196 211 199" fill="none" stroke="#7b2fff" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M216 204 C213 202 210 207 213 210" fill="none" stroke="#7b2fff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Circuit nodes around brain -->
  <circle cx="200" cy="183" r="2.5" fill="#00e5ff" filter="url(#cyanGlow)"/>
  <circle cx="200" cy="220" r="2.5" fill="#7b2fff" filter="url(#cyanGlow)"/>
  <circle cx="178" cy="200" r="2" fill="#00e5ff" opacity="0.8"/>
  <circle cx="222" cy="200" r="2" fill="#7b2fff" opacity="0.8"/>

  <!-- ===== TEXT ===== -->
  <!-- GYM -->
  <text x="200" y="285"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="46"
        font-weight="900"
        letter-spacing="10"
        text-anchor="middle"
        fill="url(#barbellGrad)"
        filter="url(#redGlow)">GYM</text>

  <!-- AI -->
  <text x="200" y="318"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="22"
        font-weight="900"
        letter-spacing="18"
        text-anchor="middle"
        fill="url(#circuitGrad)"
        filter="url(#cyanGlow)">A.I.</text>

  <!-- Tagline -->
  <text x="200" y="342"
        font-family="'Courier New', monospace"
        font-size="9"
        letter-spacing="4"
        text-anchor="middle"
        fill="#ffffff"
        opacity="0.4">TRAIN SMARTER</text>

  <!-- Decorative outer ring arc top -->
  <path d="M 60 200 A 140 140 0 0 1 340 200"
        fill="none" stroke="url(#circuitGrad)" stroke-width="1" opacity="0.25" stroke-dasharray="4,6"/>
  <!-- Decorative outer ring arc bottom -->
  <path d="M 60 200 A 140 140 0 0 0 340 200"
        fill="none" stroke="url(#barbellGrad)" stroke-width="1" opacity="0.2" stroke-dasharray="4,6"/>

  <!-- Corner accent dots -->
  <circle cx="200" cy="55" r="3" fill="#00e5ff" opacity="0.6" filter="url(#cyanGlow)"/>
  <circle cx="200" cy="358" r="3" fill="#ff2244" opacity="0.6" filter="url(#redGlow)"/>
  <circle cx="50" cy="200" r="3" fill="#00e5ff" opacity="0.4"/>
  <circle cx="350" cy="200" r="3" fill="#ff2244" opacity="0.4"/>

</svg>
